# The offline tests on GitHub's machines: on every push and pull request, and before each deploy (deploy-prod.yml runs
# them itself for main). They use the fake Jev API and a throwaway Postgres for the verifier's tests, so no key or
# secret is needed.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Stands in for the dev Postgres on 5433 (jev-verifier-db in the README); the tests make verifier_test on it.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: verifier
          POSTGRES_DB: verifier
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U verifier -d verifier"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The verifier's tests skip themselves without Postgres; here that would hide them, so a skip fails the run.
      - name: Run the offline tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          if grep -q "no Postgres at" test-output.txt; then
            echo "::error::The verifier's tests were skipped: Postgres wasn't reachable"
            exit 1
          fi
