# Deploys the verifier to production once the tests pass, on every push to main: a merged pull request from dev.
# It runs on greenworms-server's self-hosted GitHub runner, which runs docker compose there, beside dev as its own stack
# (jev-verifier-prod: own containers, database and image, port 8081). The settings and secrets stay on the server in
# /etc/jev-verifier/prod.env, never in GitHub: see the README, "Automatic tests and deploys".
name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: [self-hosted, linux, x64, greenworms-server]
    # One deploy at a time; a newer push waits rather than stopping one halfway through its migrations.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      VERIFIER_ENV_FILE: /etc/jev-verifier/prod.env
      COMPOSE_PROJECT_NAME: jev-verifier-prod
      VERIFIER_IMAGE: jev-verifier-prod
      VERIFIER_PORT: 8081
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5
      - name: Check the server's env file
        run: test -r "$VERIFIER_ENV_FILE" || { echo "::error::$VERIFIER_ENV_FILE is missing or unreadable"; exit 1; }
      # The migrations run on start, so keep a copy of the database first (none on the server's first deploy).
      - name: Back up the database
        run: |
          if [ -n "$(docker compose --env-file "$VERIFIER_ENV_FILE" ps --status running -q db)" ]; then
            BACKUP_DIR="$HOME/jev-verifier-backups/prod" ENV_FILE="$VERIFIER_ENV_FILE" ./backup.sh
          fi
      - name: Build and start
        run: docker compose --env-file "$VERIFIER_ENV_FILE" up -d --build --remove-orphans
      - name: Wait until it can reach its database
        run: |
          for _ in $(seq 30); do
            curl -fsS "http://127.0.0.1:$VERIFIER_PORT/ready" && exit 0
            sleep 2
          done
          docker compose --env-file "$VERIFIER_ENV_FILE" logs --tail 100 migrate web worker
          exit 1
      - name: Remove old images
        run: docker image prune -f
